name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # No secrets needed: the Convex client is guarded when NEXT_PUBLIC_CONVEX_URL is unset.
      # Deploys happen on Vercel, which runs `npx convex deploy --cmd 'npm run build'` (vercel.json).
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
